version: '3.8'

services:
  # PHPアプリケーションサーバー
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel_db
      - DB_USERNAME=phper
      - DB_PASSWORD=secret
    depends_on:
      - db

  # Webサーバー (Nginx)
  web:
    image: nginx:1.24-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # データベース (MySQL)
  db:
    image: mysql:8.0
    platform: linux/x86_64 # M1/M2 Mac対策
    environment:
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: phper
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: